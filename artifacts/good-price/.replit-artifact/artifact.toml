kind = "web"
previewPath = "/"
title = "착한가격업소 찾기"
version = "1.0.0"
id = "artifacts/good-price"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22244

[services.development]
run = "pnpm --filter @workspace/good-price run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/good-price", "run", "build" ]
publicDir = "artifacts/good-price/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22244"
BASE_PATH = "/"
