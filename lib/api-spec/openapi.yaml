openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 착한가격업소 찾기 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stores
    description: 착한가격업소 데이터
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: 전체 착한가격업소 목록 조회
      description: 위도/경도/업종/가격 등 정렬 및 필터링은 클라이언트에서 처리
      responses:
        "200":
          description: 업소 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
  /stores/stats:
    get:
      operationId: getStoresStats
      tags: [stores]
      summary: 업소 통계 정보
      description: 등록된 업소 수, 업종 분포, 평균 가격
      responses:
        "200":
          description: 통계 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoresStats"
  /stores/import:
    post:
      operationId: importStores
      tags: [stores]
      summary: 엑셀 데이터로 업소 일괄 교체 (관리자)
      description: 엑셀에서 파싱된 업소 데이터를 받아 전체 데이터를 교체
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stores:
                  type: array
                  items:
                    $ref: "#/components/schemas/StoreInput"
              required:
                - stores
      responses:
        "200":
          description: 업데이트 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                  total:
                    type: integer
                required:
                  - inserted
                  - total
        "400":
          description: 잘못된 입력
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Store:
      type: object
      properties:
        id:
          type: integer
        externalId:
          type: ["integer", "null"]
          description: 원본 데이터의 번호
        category:
          type: string
          description: 업종명
        name:
          type: string
          description: 업소명
        mainItem:
          type: string
          description: 주요품목
        price:
          type: integer
          description: 가격(원)
        phone:
          type: ["string", "null"]
          description: 업소 전화번호
        address:
          type: string
          description: 주소
        latitude:
          type: number
          description: 위도
        longitude:
          type: number
          description: 경도
        naverMapUrl:
          type: ["string", "null"]
          description: 네이버지도 URL
      required:
        - id
        - externalId
        - category
        - name
        - mainItem
        - price
        - phone
        - address
        - latitude
        - longitude
        - naverMapUrl
    StoresStats:
      type: object
      properties:
        total:
          type: integer
        averagePrice:
          type: integer
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        lastUpdated:
          type: ["string", "null"]
          description: ISO 8601 timestamp
      required:
        - total
        - averagePrice
        - categoryBreakdown
        - lastUpdated
    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count
    StoreInput:
      type: object
      properties:
        externalId:
          type: ["integer", "null"]
        category:
          type: string
        name:
          type: string
        mainItem:
          type: string
        price:
          type: integer
        phone:
          type: ["string", "null"]
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        naverMapUrl:
          type: ["string", "null"]
      required:
        - category
        - name
        - mainItem
        - price
        - address
        - latitude
        - longitude
    ImportStoresResponse:
      type: object
      properties:
        inserted:
          type: integer
        total:
          type: integer
      required:
        - inserted
        - total
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
